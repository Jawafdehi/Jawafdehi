<!doctype html>
<html lang="ne" translate="no">

<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The app ships a single light design system. #283 added a `.dark` token
       block and `dark:` variants, but shipped no way to reach them: its theme
       toggle was unmounted before merge, so `light dark` plus the pre-paint
       script handed every OS-dark visitor a dark site with no way back.
       Until a toggle ships, stay light-only: `only` also opts out of Chrome's
       Auto Dark Theme, so browsers can't auto-invert our colours either. -->
  <meta name="color-scheme" content="only light" />
  <!-- The in-app EN/NE language switcher is the single source of truth for language; suppress browser/Google page auto-translation so it can't compete with or re-translate curated content. -->
  <meta name="google" content="notranslate" />
  <!-- Icons. None of these were declared before, so /apple-touch-icon.png and
       /site.webmanifest fell through to the SPA and answered with HTML: saving
       the site to an iOS home screen got a screenshot instead of the logo. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Must match the hex documented on --primary in src/index.css. -->
  <meta name="theme-color" content="#0E1F3B" />
  <!-- The hero H1 renders in Vesper Libre Bold on every page's first paint.
       Without a preload the font is only discovered after CSS parse, so the
       headline sits ~2s in the Georgia fallback and then reflows — a swap
       that alone eats most of the CLS budget on Slow 4G (PR #359 review).
       `crossorigin` is required even same-origin: font fetches are CORS-mode,
       and a mismatch makes the browser fetch the file twice. -->
  <link rel="preload" href="/font/Vesper_Libre/VesperLibre-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <!-- Site-wide, so it lives here rather than in all 19 per-page Helmets. -->
  <meta name="twitter:site" content="@jawafdehi" />
  <!--helmet-title-->
  <!--helmet-meta-->
  <!-- fallback static meta for non-JS crawlers -->
  <!-- Let's Build Nepal is a supporting partner, not the author of this site.
       See src/components/home/supportingpartner.tsx for where they belong. -->
  <meta name="author" content="Jawafdehi Initiative" />
</head>

<body>
  <div id="root"><!--app-html--></div>
  <!--dehydrated-state-->
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
