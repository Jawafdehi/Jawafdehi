<!doctype html>
<html lang="ne" translate="no">

<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Both light and dark are designed and token-backed (see :root and .dark in
       src/index.css). #279 set `only light`, correct while the app shipped a
       single light theme; with a real dark theme it must become `light dark`.
       Declaring it keeps UA widgets in step and still stops browsers
       auto-inverting a theme we own. -->
  <meta name="color-scheme" content="light dark" />

  <!-- Applies the theme class before first paint. ThemeProvider intentionally
       mounts only after hydration, so next-themes' own blocking script never
       runs; without this a dark-preference visitor gets a full light page and
       then an abrupt flip. Reads the same localStorage key next-themes uses. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || ((!t || t === "system") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
  <!-- The in-app EN/NE language switcher is the single source of truth for language; suppress browser/Google page auto-translation so it can't compete with or re-translate curated content. -->
  <meta name="google" content="notranslate" />
  <!-- Icons. None of these were declared before, so /apple-touch-icon.png and
       /site.webmanifest fell through to the SPA and answered with HTML: saving
       the site to an iOS home screen got a screenshot instead of the logo. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Must match the hex documented on --primary in src/index.css. -->
  <meta name="theme-color" content="#0E1F3B" />
  <!-- Site-wide, so it lives here rather than in all 19 per-page Helmets. -->
  <meta name="twitter:site" content="@jawafdehi" />
  <!--helmet-title-->
  <!--helmet-meta-->
  <!-- fallback static meta for non-JS crawlers -->
  <!-- Let's Build Nepal is a supporting partner, not the author of this site.
       See src/components/home/supportingpartner.tsx for where they belong. -->
  <meta name="author" content="Jawafdehi Initiative" />
</head>

<body>
  <div id="root"><!--app-html--></div>
  <!--dehydrated-state-->
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
