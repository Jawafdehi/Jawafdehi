<!doctype html>
<html lang="ne" translate="no">

<head>
  <meta charset="UTF-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The app ships a single light design system. #283 added a `.dark` token
       block and `dark:` variants, but shipped no way to reach them: its theme
       toggle was unmounted before merge, so `light dark` plus the pre-paint
       script handed every OS-dark visitor a dark site with no way back.
       Until a toggle ships, stay light-only: `only` also opts out of Chrome's
       Auto Dark Theme, so browsers can't auto-invert our colours either. -->
  <meta name="color-scheme" content="only light" />
  <!-- The in-app EN/NE language switcher is the single source of truth for language; suppress browser/Google page auto-translation so it can't compete with or re-translate curated content. -->
  <meta name="google" content="notranslate" />
  <!-- Icons. None of these were declared before, so /apple-touch-icon.png and
       /site.webmanifest fell through to the SPA and answered with HTML: saving
       the site to an iOS home screen got a screenshot instead of the logo. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Must match the hex documented on --primary in src/index.css. -->
  <meta name="theme-color" content="#0E1F3B" />
  <!-- The hero H1 renders in the locale's headline face — Vesper Libre Bold
       under lang="ne", Inter under lang="en" (--font-family-heading in
       src/styles/typography.css). Without a preload the font is only
       discovered after CSS parse, so the headline sits ~2s in the fallback and
       then reflows — a swap that alone eats most of the CLS budget on Slow 4G
       (PR #359 review).
       There are two faces and TWO moments to cover, which is why this is a
       script and not a static link:
         - First paint is decided by this document's own `lang`, not by the
           visitor's preference. Pre-rendered pages ship Nepali markup under
           lang="ne", and /research/corruption-accountability ships lang="en"
           (ResearchCorruption.tsx, propagated by scripts/pre-render.ts). So the
           face that actually paints is the one `lang` selects, every time.
         - src/i18n/config.ts then flips to the stored preference on the next
           animation frame, and that face carries the rest of the session.
       They agree for most visitors, and then this preloads exactly one file.
       They differ for a stored-English visitor on a Nepali page — who really
       does use both, Vesper for the pre-rendered paint and Inter from
       hydration on — so both are preloaded rather than guessing wrong at the
       moment the CLS is measured.
       Inline and synchronous, so the fetch still starts during head parse,
       ahead of the stylesheet request.
       `crossorigin` is required even same-origin: font fetches are CORS-mode,
       and a mismatch makes the browser fetch the file twice. -->
  <script>
    (function () {
      function faceFor(language) {
        return language.indexOf('en') === 0
          ? '/font/Inter/Inter-latin-wght.woff2'
          : '/font/Vesper_Libre/VesperLibre-Bold.woff2';
      }

      var painted = faceFor(document.documentElement.lang || 'ne');
      var stored = '';
      try {
        stored = window.localStorage.getItem('i18nextLng') || '';
      } catch (e) {
        // Storage blocked or unavailable — this document's lang is the answer.
      }
      var session = stored ? faceFor(stored) : painted;

      var hrefs = session === painted ? [painted] : [painted, session];
      for (var i = 0; i < hrefs.length; i++) {
        var preload = document.createElement('link');
        // setAttribute, not the IDL properties: `as` is the one that decides
        // whether this is a font preload at all, and it has no reflected
        // property in every engine that runs this.
        preload.setAttribute('rel', 'preload');
        preload.setAttribute('as', 'font');
        preload.setAttribute('type', 'font/woff2');
        preload.setAttribute('crossorigin', 'anonymous');
        preload.setAttribute('href', hrefs[i]);
        document.head.appendChild(preload);
      }
    })();
  </script>
  <!-- Site-wide, so it lives here rather than in all 19 per-page Helmets. -->
  <meta name="twitter:site" content="@jawafdehi" />
  <!--helmet-title-->
  <!--helmet-meta-->
  <!-- fallback static meta for non-JS crawlers -->
  <!-- Let's Build Nepal is a supporting partner, not the author of this site.
       See src/components/home/supportingpartner.tsx for where they belong. -->
  <meta name="author" content="Jawafdehi Initiative" />
</head>

<body>
  <div id="root"><!--app-html--></div>
  <!--dehydrated-state-->
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
